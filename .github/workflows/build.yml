name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          test -f index.html
          echo '{"name":"argavan","version":"1.0.0","private":true}' > package.json
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6 @capacitor/status-bar@6 html2canvas@1.4.1 jspdf@2.5.1 @fontsource/vazirmatn
          mkdir -p www/lib
          cp index.html www/index.html
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          cp -r node_modules/@fontsource/vazirmatn www/fonts
          python3 - <<'PY'
          p = 'www/index.html'
          s = open(p, encoding='utf8').read()
          s = s.replace('<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">', '<link href="fonts/400.css" rel="stylesheet"><link href="fonts/700.css" rel="stylesheet">')
          s = s.replace('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'lib/html2canvas.min.js')
          s = s.replace('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', 'lib/jspdf.umd.min.js')
          open(p, 'w', encoding='utf8').write(s)
          PY

      - name: Create Android project
        run: |
          echo '{"appId":"com.argavan.faktor","appName":"ارغوان","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Make app icon
        if: ${{ hashFiles('icon.png') != '' }}
        continue-on-error: true
        run: |
          npm i -D @capacitor/assets@3
          mkdir -p assets
          cp icon.png assets/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#6366f1' --iconBackgroundColorDark '#6366f1'

      - name: Configure app
        run: |
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1/versionCode $GITHUB_RUN_NUMBER/;s/versionName \"1.0\"/versionName \"1.$GITHUB_RUN_NUMBER\"/" android/app/build.gradle

      - name: Signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; else echo "debug.keystore not found, using a temporary key"; fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Argavan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Argavan-APK
          path: Argavan.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Argavan build ${{ github.run_number }}
          files: Argavan.apk
